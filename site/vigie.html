<!doctype html><html><head><meta charset="utf-8"><title>vigie — mtlm decision stats</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:14px/1.5 ui-monospace,monospace;background:#0d1117;color:#c9d1d9;max-width:900px;margin:2rem auto;padding:0 1rem}
h1{color:#58a6ff;font-size:1.3rem}table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border-bottom:1px solid #21262d;padding:6px 8px;text-align:left;vertical-align:top}
th{color:#8b949e}.top{color:#8b949e;font-size:.78rem}.meta{color:#8b949e;font-size:.8rem;margin-top:1.5rem}
a{color:#58a6ff}#err{color:#f85149;display:none}</style></head><body>
<h1>vigie — mtlm-router decision stats</h1>
<p class="meta"><span id="tot">loading…</span> · live from <code>/v1/stats</code> · data: <a href="https://api.mtlm-router.intrane.fr/v1/stats">api</a></p>
<p id="err"></p>
<table><thead><tr><th>lane</th><th>decisions</th><th>24h</th><th>avg conf</th><th>delegate</th><th>top routes</th></tr></thead><tbody id="tb"></tbody></table>
<p class="meta">abstention-first: high delegate rates are the product working — uncertain traffic escalates rather than guesses. <a href="/">mtlm-router</a> · <a href="/catalog.html">catalog</a></p>
<script>
fetch('https://api.mtlm-router.intrane.fr/v1/stats').then(r=>r.json()).then(d=>{
  document.getElementById('tot').textContent = d.total_decisions.toLocaleString()+' decisions recorded · updated '+new Date(d.generated_ms).toLocaleString();
  const tb=document.getElementById('tb');
  Object.entries(d.lanes).sort((a,b)=>b[1].decisions-a[1].decisions).forEach(([n,l])=>{
    const top=Object.entries(l.top_routes||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([r,c])=>r+' '+c).join(' · ');
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${n}</b></td><td>${l.decisions.toLocaleString()}</td><td>${l.last24h}</td><td>${(l.avg_conf*100).toFixed(0)}%</td><td>${(l.delegate_rate*100).toFixed(0)}%</td><td class="top">${top}</td>`;
    tb.appendChild(tr);
  });
}).catch(e=>{const er=document.getElementById('err');er.style.display='block';er.textContent='stats fetch failed: '+e});
</script></body></html>
